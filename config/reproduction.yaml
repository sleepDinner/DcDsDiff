# Paper-aligned main model on an explicitly reconstructed GIT10K split.
project_name: DcDsDiff-GIT10K-reconstruction-v1
protocol_id: GIT10K-PAPER-RECON-V1
seed: 42
num_epoch: 100
batch_size: 6
gradient_accumulate_every: 1
num_workers: 4
lr_min: 1.0e-6
fp16: false
log_with: none
save_every: 10
status_interval_seconds: 60
results_folder: runs/manual
resume: null
pretrained: null
model:
  name: model.net.net
  params:
    class_num: 1
    mask_chans: 1
    architecture_version: paper-aligned-v1
    allow_pretrained_download: false
    pretrained_path: pretrained_weights/pvt_v2_b2.pth
cond_uvit:
  name: model.net.EmptyObject
  params:
    conditioning_klass: model.net.EmptyObject
diffusion_model:
  name: model.SimpleDiffSef.CondGaussianDiffusion
  params:
    image_size: 352
    channels: 1
    cond_channels: 3
    noise_d: 64
    num_sample_steps: 10
    clip_sample_denoised: true
    pred_objective: x0
    loss_type: model.loss.structure_loss
optimizer:
  name: torch.optim.AdamW
  params:
    lr: 0.001
    weight_decay: 0.01
train_val_forward_fn: model.train_val_forward.modification_train_val_forward
train_dataset:
  name: dataset.data_val.PolypObjDataset
  params:
    image_root: data/git10k-recon-v1/train/f/
    gt_root: data/git10k-recon-v1/train/m/
    de_root: data/git10k-recon-v1/train/d/
    trace_root: data/git10k-recon-v1/train/t/
    trainsize: 352
    horizontal_flip: true
test_dataset:
  Mix:
    name: dataset.data_val.test_dataset
    params:
      image_root: data/git10k-recon-v1/test/f/
      gt_root: data/git10k-recon-v1/test/m/
      de_root: data/git10k-recon-v1/test/d/
      trace_root: data/git10k-recon-v1/test/t/
      testsize: 352
